org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KonMin Launcher Mobile version (the upstream property names are kept: build scripts read them).
millida.versionCode=1
millida.versionName=1.0.0-konmin

# KonMin services (see README «Configuration»). Leave empty to build a launcher that needs no KonMin server.
konmin.msClientId=
konmin.runtimeManifestUrl=
konmin.millidaServices=false
